<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Boxi - Help</title>
        <link rel="stylesheet" href="../Styles/globals.css">
        <link rel="stylesheet" href="../Styles/Help.css">
    </head>
    <body>
        <div id="link-container"></div>

        <h1>Help Menu</h1>
        <div class="section">
            <h2>How to play</h2>
            <p class="description">
                Use the <span class="player icon-text">player</span> to move around the <span class="box icon-text">box</span> and get
                it to the <span class="goal icon-text">goal</span>. Getting the <span class="box icon-text">box</span> to the
                <span class="goal icon-text">goal</span> gets you a point. The goal is to get as many points as you can.
            </p>
        </div>

        <div class="section">
            <h2>Controls</h2>
            <div class="controls">
                <div class="main-controls">
                    <div class="control">Up: <div class="key">&UpArrow;</div> or <div class="key">W</div></div>
                    <div class="control">Left: <div class="key">&LeftArrow;</div> or <div class="key">A</div></div>
                    <div class="control">Down: <div class="key">&DownArrow;</div> or <div class="key">S</div></div>
                    <div class="control">Right: <div class="key">&RightArrow;</div> or <div class="key">D</div></div>
                    <div class="control">Cycle Color: </div>
                </div>
                <div class="sub-controls">
                    <div class="sub-control">Previous: <div class="key">[</div></div>
                    <div class="sub-control">Next: <div class="key">]</div></div>
                </div>
            </div>
        </div>


        <script src="../JavaScript/Help.js"></script>
    </body>
</html>
